name: AI Coding Agent Demo

on:
  issues:
    types: [opened]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python environment and install dependencies
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install requests

    # 3. Run the AI agent script
    - name: Run AI Agent
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: python agent.py

    # 4. Automatically create a Pull Request with the changes
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "feat: AI implemented requested changes"
        title: "AI-Generated Fix: ${{ github.event.issue.title }}"
        body: "This Pull Request was automatically generated by DeepSeek AI in response to Issue #${{ github.event.issue.number }}."
        branch: ai-agent-branch
        delete-branch: true
